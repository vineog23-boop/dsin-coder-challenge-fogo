spring.application.name=challengefogo

# Database & Flyway
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/fogo}
spring.datasource.username=${DB_USERNAME:fogo}
spring.datasource.password=${DB_PASSWORD:fogo}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Actuator
management.endpoints.web.exposure.include=health

# JWT (em produção, JWT_SECRET deve vir do ambiente; o padrão é só para desenvolvimento)
app.jwt.secret=${JWT_SECRET:fogo-dev-secret-troque-em-producao-0123456789}
