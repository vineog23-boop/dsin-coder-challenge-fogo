server {
    listen 80;
    root /usr/share/nginx/html;

    # O health do back fica fora de /api; expô-lo aqui permite conferir a API pelo mesmo endereço do front.
    location = /api/actuator/health {
        proxy_pass http://backend:8080/actuator/health;
    }

    # Mesmo papel do proxy do Vite em dev: front e API na mesma origem, sem CORS.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: rotas do React Router (/equipamentos, /agentes) caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
